name: lw.Web2Harmony CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PRODUCT_VERSION: '0.1.0'
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate versions and PowerShell
        shell: pwsh
        run: |
          $lock=Get-Content -Raw toolchain.lock.json|ConvertFrom-Json
          if ($lock.productVersion -ne $env:PRODUCT_VERSION) { throw 'Product version mismatch' }
          if (-not (Get-Content -Raw CMakeLists.txt).Contains("VERSION $env:PRODUCT_VERSION ")) { throw 'CMake version mismatch' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$env:PRODUCT_VERSION") { throw 'Tag does not match product version' }
          Get-ChildItem tools,tests -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if ($errors) { throw ($errors.Message -join '; ') }
          }
      # JDK is only for ephemeral P12/CSR tests, not HarmonyOS compilation.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .deps/spdlog.tar.gz
          key: spdlog-1.17.0-d8862955
      - name: Download and verify pinned spdlog source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .deps | Out-Null
          if (-not (Test-Path .deps/spdlog.tar.gz)) {
            curl.exe -L --fail --retry 3 -o .deps/spdlog.tar.gz https://github.com/gabime/spdlog/archive/refs/tags/v1.17.0.tar.gz
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ((Get-FileHash .deps/spdlog.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd8862955c6d74e5846b3f580b1605d2428b11d97a410d86e2fb13e857cd3a744') { throw 'spdlog SHA256 mismatch' }
      - name: Build and test Windows tools
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON "-DLW_SIGNING_JAVA_HOME=$env:JAVA_HOME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/Release/lw.Web2Harmony.exe export samples/hello/project.json build/generated/hello
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/Release/lw.Web2Harmony.exe export samples/remote/project.json build/generated/remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package desktop distribution (no HAP build)
        shell: pwsh
        run: |
          ./tools/package-release.ps1
          $package="build/releases/lw-Web2Harmony-v$env:PRODUCT_VERSION-windows-x64"
          $metadata=Get-Content -Raw "$package/release.json"|ConvertFrom-Json
          if ($metadata.demoHapsIncluded -or $metadata.harmonySdkIncluded) { throw 'Unexpected HAP/SDK in desktop distribution' }
          if (Get-ChildItem $package -Recurse -File | Where-Object { $_.Extension -in '.p12','.pfx','.cer','.p7b','.csr','.hap' -or $_.Name -eq 'credentials.dpapi.json' }) { throw 'Signing material/HAP leaked into desktop distribution' }
      - uses: actions/upload-artifact@v4
        with:
          name: lw-Web2Harmony-v0.1.0-windows-x64
          path: |
            build/releases/*.zip
            build/releases/*.sha256
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lw-Web2Harmony-v0.1.0-windows-x64
          path: build/releases
      - name: Publish tagged Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$env:PRODUCT_VERSION") { throw 'Tag does not match product version' }
          gh release create $env:GITHUB_REF_NAME build/releases/*.zip build/releases/*.sha256 --verify-tag --title "lw.Web2Harmony $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-v0.1.0.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
